seed: 42
model_path: models/clip-vit-base-patch32
dataset_path: data/rstpreid
output_dir: outputs/main_r16_a32_all

train:
  epochs: 5
  batch_size: 16
  eval_batch_size: 64
  gradient_accumulation_steps: 2
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_ratio: 0.1
  num_workers: 0
  mixed_precision: bf16
  max_train_pairs: null
  max_eval_images: null
  log_every: 100

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - out_proj
